services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-running}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-running}
      POSTGRES_DB: ${POSTGRES_DB:-runningdashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-running} -d ${POSTGRES_DB:-runningdashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
      network: host
      provenance: false
      sbom: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_DIR: ${LOG_DIR:-/var/log/running-dashboards/host-logs}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE_NAME: ${LOG_FILE_NAME:-api.log}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-running}:${POSTGRES_PASSWORD:-running}@postgres:5432/${POSTGRES_DB:-runningdashboard}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,https://localhost:443,http://localhost,http://localhost:80,http://localhost:5173}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-http://localhost/api/strava/callback}
      STRAVA_SCOPES: ${STRAVA_SCOPES:-read,activity:read_all,profile:read_all}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      OLLAMA_CHAT_TIMEOUT_S: ${OLLAMA_CHAT_TIMEOUT_S:-600}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-650}
    volumes:
      - ${HOST_LOG_DIR:-/var/log/running-dashboards/host-logs}:${LOG_DIR:-/var/log/running-dashboards/host-logs}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      network: host
      provenance: false
      sbom: false
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
      network: host
      provenance: false
      sbom: false
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "${APP_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  caddy_data:
  caddy_config:
