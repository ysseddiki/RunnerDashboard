services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-running}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-running}
      POSTGRES_DB: ${POSTGRES_DB:-runningdashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-running} -d ${POSTGRES_DB:-runningdashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
      provenance: false
      sbom: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_DIR: ${LOG_DIR:-/var/log/running-dashboards/host-logs}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE_NAME: ${LOG_FILE_NAME:-api.log}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-running}:${POSTGRES_PASSWORD:-running}@postgres:5432/${POSTGRES_DB:-runningdashboard}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:443,http://localhost:5173}
    volumes:
      - ${HOST_LOG_DIR:-/var/log/running-dashboards/host-logs}:${LOG_DIR:-/var/log/running-dashboards/host-logs}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      provenance: false
      sbom: false
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "${APP_PORT:-443}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
